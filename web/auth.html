<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151d">
    <title>Sign in to Crelan</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/auth.js" defer></script>
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <a class="brand auth-brand" href="/" aria-label="Crelan home">
        <span class="brand-mark">C</span>
        <span>crelan<span class="brand-period">.</span></span>
      </a>
      <section class="auth-card">
        <div class="eyebrow" id="auth-eyebrow">WELCOME BACK</div>
        <h1 id="auth-title">Sign in to Crelan</h1>
        <p class="auth-subtitle" id="auth-subtitle">Enter your credentials to access your workspace.</p>
        <form id="auth-form">
          <label class="form-label" for="identity-field">Username</label>
          <input class="text-input auth-input" id="identity-field" name="identity" type="text" autocomplete="username" placeholder="Username or email" maxlength="254" required>
          <label class="form-label password-label" for="password-field">Password</label>
          <input class="text-input auth-input" id="password-field" name="password" type="password" autocomplete="current-password" placeholder="Password" maxlength="128" required>
          <p class="auth-error" id="auth-error" role="alert" hidden></p>
          <button class="primary-button auth-submit" id="auth-submit" type="submit">Open workspace</button>
        </form>
      </section>
      <p class="auth-footnote">Secured workspace access.</p>
    </main>
  </body>
</html>
